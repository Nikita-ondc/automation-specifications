          _RETURN_: attr all in enumList
        - _NAME_: VALID_ON_RECEIVER_RECON_DIFF_CURRENCY
          attr: $.message.orderbook.orders[*].counterparty_diff_amount.currency
          enumList:
            - "INR"
          _CONTINUE_: "!(attr are present)"
          _RETURN_: attr all in enumList
    - _NAME_: ON_RECEIVER_RECON_COUNTERPARTY_DIFF_AMOUNT
      diffPath: $.message.orderbook.orders[*].counterparty_diff_amount
