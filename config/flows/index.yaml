        - nominee_details_form
        - init4
        - on_init4
        - manual_review_form
        - on_status_unsolicited8
        - confirm
        - on_confirm
        - payment_form
        - on_update
      visible_actions:
        - cancel
        - on_cancel
        - on_update_unsolicited7
      display:
        actions:
          cancel: Request policy cancellation
          on_cancel: Receive the cancellation confirmation
          on_update_unsolicited7: Receive a cancellation status update
    usecase: Health Insurance
