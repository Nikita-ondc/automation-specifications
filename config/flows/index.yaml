    meta:
      order: 11
      type: PRIMARY
    usecase: Health Insurance
    tags:
      - WORKBENCH
      - MANDATORY
      - REPORTABLE
    description: Complete cancellation workflow for a customer to search, select, and cancel their active family health insurance policy with confirmation and status updates.
    config:
      $ref: ./HEALTH INSURANCE/Cancel_Health_Insurance_Family_.yaml
  - type: playground
    id: Cancel_Health_Insurance(Individual)
    meta:
      order: 10
      type: SECONDARY
      hide_actions:
        - search
        - on_search
        - individual_information_form
        - search3
        - on_search3
        - select
        - on_select
        - ped_details_form
        - select2
        - on_select2
        - Ekyc_details_form
        - on_status_unsolicited4
        - init
