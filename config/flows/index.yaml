      type: PRIMARY
    usecase: Health Insurance
    tags:
      - WORKBENCH
    description: A family health insurance journey that follows the standard application flow up to on_confirm, then exercises a payment-failure path with a Not-Pay option, an unsolicited on_update marking the payment FAILED, a BAP update retry, and an on_update returning a fresh NOT-PAID payment link.
    config:
      $ref: ./HEALTH INSURANCE/Payment_Failure_Health_Insurance_Family_.yaml

