        timestamp: '2026-10-12T10:34:58.469Z'
        ttl: P2D
      message: {}
    saveData:
      transactionId: $.context.transaction_id
      latestMessage_id: $.context.message_id
      latestTimestamp: $.context.timestamp
      bapId: $.context.bap_id
      bapUri: $.context.bap_uri
      bppId: $.context.bpp_id
      bppUri: $.context.bpp_uri
      city_code: $.context.city
      counterparty_recon_status: $.message.orderbook.orders[0].counterparty_recon_status
      counterparty_diff_value: $.message.orderbook.orders[0].counterparty_diff_amount.value
    inputs:
      id: nts10_underpaid_overpaid_input
      jsonSchema:
        $schema: http://json-schema.org/draft-07/schema#
        type: object
        additionalProperties: false
        properties:
          deviation_type:
            type: string
            description: Whether the receiver was underpaid or overpaid
            enum:
            - UNDERPAID
            - OVERPAID
            default: UNDERPAID
          diff_amount:
            type: string
            description: Deviation amount (INR) between the expected and the settled amount
            default: '20'
        required:
        - deviation_type
        - diff_amount
  examples:
  - name: example for on_receiver_recon
    type: request
    description: 'The receiver (BPP) reconciles the order book against its bank statement and reports a deviation: the order was underpaid (counterparty_recon_status 03) or overpaid (02) by the diff amount given as user input.'
