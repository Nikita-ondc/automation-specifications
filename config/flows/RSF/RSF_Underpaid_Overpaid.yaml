- api: on_receiver_recon
  action_id: on_receiver_recon_1
  owner: BPP
  responseFor: receiver_recon_1
  unsolicited: false
  description: 'The receiver (BPP) reconciles the order book against its bank statement and reports a deviation: the order was underpaid (counterparty_recon_status 03) or overpaid (02) by the diff amount given as user input.'
  mock:
    generate: 
    validate: 
    requirements: 
    defaultPayload:
      context: &id003
        domain: ONDC:NTS10
        country: IND
        city: std:080
        action: on_receiver_recon
        core_version: 1.0.0
        bap_id: bap.example.com
        bap_uri: https://bap.example.com
        bpp_id: dev-workbench.ondc.tech
